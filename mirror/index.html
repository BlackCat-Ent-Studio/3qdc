        var resizeRoot = function () {
          wWidth =
            document.documentElement.clientWidth || document.body.clientWidth;

            "resizeRoot     wWidth: ",

            dataDv,

            wFsize

          document.documentElement.style.fontSize = wFsize + "px";

        window.addEventListener(
          "pageshow",
          function (e) {
            if (e.persisted) {
              clearTimeout(tid);

          setTimeout(function () {
            resizeRoot();
          }, 500);
        } else {
          resizeRoot();
        }
        window.addEventListener(
          "orientationchange",
          function () {
            setTimeout(function () {
              resizeRoot();
            }, 500);
          },
          false
        );
